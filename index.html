<!DOCTYPE html>
<html lang="en">
  <head> </head>
  <body>
    <a href="/">обновить страницу</a>
    <script>
      let Username = prompt("Enter your name");
      //console.log(name);
      const wind = ["windy", "no wind", "storm"];
      const rain = ["no rain", "rainy", "heavy rain"];

      function rnd(max) {
        return Math.floor(Math.random() * max);
      }
      function getWheater() {
        const wheater = {};

        const windIndex = rnd(wind.length);
        wheater.wind = wind[windIndex];

        const rainIndex = rnd(rain.length);
        wheater.rain = rain[rainIndex];

        return wheater;
      }

      function weatherChek() {
        const wheater = getWheater();
        if (wheater.wind === "storm" || wheater.rain === "heavy rain") {
          alert(
            "Hello," +
              Username +
              " the weather is not good for a walk " +
              wheater.rain +
              " " +
              wheater.wind
          );
        } else {
          alert(
            "Hello," +
              Username +
              " the weather nice, go outside " +
              wheater.rain +
              " " +
              wheater.wind
          );
        }
      }

      weatherChek();
    </script>
  </body>
</html>
