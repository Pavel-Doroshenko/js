<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>"прогноз погоды"</title>
  </head>
  <body>
    <a href="/">обновить страницу</a>
    <script>
      let Username = prompt("Enter your name");
      if (Username !== "") {
        Username = Username;
      } else {
        Username = prompt("Имя неможет быть пустым. Введите имя");
      }
      const wind = ["windy", "no wind", "storm"];
      const rain = ["no rain", "rainy", "heavy rain"];

      function rnd(max) {
        return Math.floor(Math.random() * max);
      }
      function getWheater() {
        const wheather = {};

        const windIndex = rnd(wind.length);
        wheather.wind = wind[windIndex];

        const rainIndex = rnd(rain.length);
        wheather.rain = rain[rainIndex];

        return wheather;
      }

      function weatherChek() {
        const wheather = getWheater();
        if (wheather.wind === "storm" || wheather.rain === "heavy rain") {
          document.write(
            "Hello," +
              Username +
              " the weather is not good for a walk " +
              wheather.rain +
              " " +
              wheather.wind
          );
        } else {
          document.writet(
            "Hello," +
              Username +
              " the weather nice, go outside " +
              wheather.rain +
              " " +
              wheather.wind
          );
        }
      }

      weatherChek();
    </script>
  </body>
</html>
